<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum to N</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Calculate the Sum from 1 to N</h1>

        <label for="numberInput" class="label">Enter a number:</label>
        <input type="number" id="numberInput" class="input" placeholder="Enter n" />
        <button id="calculateButton" class="button">Calculate</button>

        <h2>Result:</h2>
        <p id="result" class="result">The result will be displayed here</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
